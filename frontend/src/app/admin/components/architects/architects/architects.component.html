@if (architects) {
  <div class="d-flex flex-row align-items-stretch h-100">
    <app-architects-list class="list" [architects]="architects" (architectSelected)="architectSelected($event)"></app-architects-list>
    @if (selectedArchitect) {
      <app-architect class="detail" [architect]="selectedArchitect" (updated)="updated($event)"></app-architect>
    }
  </div>
}
